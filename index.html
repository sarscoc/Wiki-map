<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <title>Wiki Map</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <div id="map" aria-label="Wiki Map"></div>
    <div class="top-bar">
      <div class="brand">Wiki Map</div>
      <button id="loadAreaButton" class="load-button" type="button">この範囲を読み込む</button>
      <div id="status" class="status">地図を動かして読み込んでください</div>
    </div>

    <section id="topicSheet" class="topic-sheet" aria-live="polite">
      <button id="sheetHandle" class="sheet-handle" type="button" aria-expanded="false">
        <span class="grabber" aria-hidden="true"></span>
        <span id="sheetTitle">この周辺のトピック</span>
        <span id="sheetCount" class="sheet-count"></span>
      </button>

      <div class="sheet-tabs" role="tablist" aria-label="表示内容">
        <button class="sheet-tab active" type="button" data-tab="topics" role="tab" aria-selected="true">トピック</button>
        <button class="sheet-tab" type="button" data-tab="history" role="tab" aria-selected="false">履歴</button>
      </div>

      <div id="topicFilters" class="topic-filters" aria-label="トピック表示フィルター">
        <span class="topic-filter-label">SHOW</span>
        <button type="button" class="topic-filter" data-category="transit_stop" aria-pressed="false">駅・停留所</button>
        <button type="button" class="topic-filter" data-category="route" aria-pressed="false">路線</button>
        <button type="button" class="topic-filter" data-category="numbered_road" aria-pressed="false">番号道路</button>
        <button type="button" class="topic-filter" data-category="transit_operator" aria-pressed="false">交通事業者</button>
        <button type="button" class="topic-filter" data-category="place" aria-pressed="false">地名</button>
        <button type="button" class="topic-filter" data-category="date" aria-pressed="false">日付</button>
        <button type="button" class="topic-filter" data-category="org" aria-pressed="false">企業・団体</button>
        <button type="button" class="topic-filter" data-category="common" aria-pressed="false">普通名詞</button>
      </div>

      <div id="topicList" class="topic-list"></div>

      <div id="trailBar" class="selection-bar" hidden>
        <span id="trailText"></span>
        <button id="clearTrailButton" class="selection-close" type="button" aria-label="周辺トピックへ戻る">×</button>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="app.js"></script>
  <script>
  // 歴史散歩で重要な「場所」は、行政地名フィルターに巻き込まない。
  (() => {
    const protectedTitlePattern = /(?:神社|神宮|大社|宮|寺|寺院|院|堂|城|城跡|城址|史跡|遺跡|古墳|公園|庭園|博物館|美術館|資料館|記念館|墓地|墓所|霊園|塔|門|櫓|砦|館跡|屋敷跡)$/;
    const protectedTypes = new Set([
      '神社','神宮','神道の神社','神道施設','寺院','仏教寺院','城','城郭','城跡','史跡','遺跡','考古遺跡','古墳','公園','庭園','博物館','美術館','墓地','墓所','宗教施設','宗教建築物','建築物','歴史的建築物',
      'shinto shrine','shrine','buddhist temple','temple','castle','castle ruin','historic site','historical site','archaeological site','kofun','park','garden','museum','art museum','cemetery','burial ground','religious building','religious facility','historic building'
    ].map(v => v.toLowerCase()));

    const originalObviousCategory = obviousCategory;
    obviousCategory = function(title) {
      if (protectedTitlePattern.test(title)) return 'other';
      return originalObviousCategory(title);
    };

    const originalCategoryFromLabels = categoryFromLabels;
    categoryFromLabels = function(labels) {
      const normalized = labels.map(value => String(value).trim().toLowerCase());
      if (normalized.some(value => protectedTypes.has(value))) return 'other';
      return originalCategoryFromLabels(labels);
    };

    // 以前「地名」と誤分類された歴史施設だけキャッシュから外す。
    for (const [title, category] of [...typeCache]) {
      if (category === 'place' && protectedTitlePattern.test(title)) typeCache.delete(title);
    }
    saveTypeCache();
  })();
  </script>
  <script src="walk-mode.js"></script>
</body>
</html>
