<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <title>Wiki Map</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <div id="map" aria-label="Wiki Map"></div>
    <div class="top-bar"><div class="brand">Wiki Map</div><button id="loadAreaButton" class="load-button" type="button">この範囲を読み込む</button><div id="status" class="status">地図を動かして読み込んでください</div></div>
    <section id="topicSheet" class="topic-sheet" aria-live="polite">
      <button id="sheetHandle" class="sheet-handle" type="button" aria-expanded="false"><span class="grabber" aria-hidden="true"></span><span id="sheetTitle">この周辺のトピック</span><span id="sheetCount" class="sheet-count"></span></button>
      <div class="sheet-tabs" role="tablist" aria-label="表示内容"><button class="sheet-tab active" type="button" data-tab="topics" role="tab" aria-selected="true">トピック</button><button class="sheet-tab" type="button" data-tab="links" role="tab" aria-selected="false" disabled>リンク</button><button class="sheet-tab" type="button" data-tab="text" role="tab" aria-selected="false" disabled>テキスト候補</button><button class="sheet-tab" type="button" data-tab="history" role="tab" aria-selected="false">履歴</button></div>
      <div id="topicFilters" class="topic-filters" aria-label="トピック表示フィルター"><span class="topic-filter-label">SHOW</span><button type="button" class="topic-filter" data-category="transit_stop" aria-pressed="false">駅・停留所</button><button type="button" class="topic-filter" data-category="route" aria-pressed="false">路線</button><button type="button" class="topic-filter" data-category="numbered_road" aria-pressed="false">番号道路</button><button type="button" class="topic-filter" data-category="transit_operator" aria-pressed="false">交通事業者</button><button type="button" class="topic-filter" data-category="place" aria-pressed="false">地名</button><button type="button" class="topic-filter" data-category="date" aria-pressed="false">日付</button><button type="button" class="topic-filter" data-category="org" aria-pressed="false">企業・団体</button><button type="button" class="topic-filter" data-category="common" aria-pressed="false">普通名詞</button></div>
      <div id="topicList" class="topic-list"></div>
      <div id="selectionBar" class="selection-bar" hidden><span id="selectionText"></span><button id="clearSelectionButton" class="selection-close" type="button" aria-label="トピック選択を解除">×</button></div>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="app.js"></script>
  <script>
  // app.js の座標照合で、正規化・リダイレクト後も元リンクの文脈を引き継ぐ。
  coordinatesForTitles = async function(titles, source, topicTitle, token, contextMap = new Map()) {
    const found = [];
    for (let i = 0; i < titles.length; i += 50) {
      if (token !== requestToken) return [];
      const batch = titles.slice(i, i + 50);
      setStatus(`${topicTitle}：${source === 'link' ? 'リンク' : 'テキスト候補'}を照合中 ${Math.min(i + batch.length, titles.length)}/${titles.length}`);
      const params = new URLSearchParams({ action:'query', format:'json', origin:'*', prop:'coordinates|pageprops', ppprop:'wikibase_item', colimit:'max', redirects:'1', titles:batch.join('|') });
      const data = await fetchJson('https://ja.wikipedia.org/w/api.php?' + params);

      const originalFor = new Map(batch.map(title => [title, title]));
      for (const n of data.query?.normalized || []) originalFor.set(n.to, originalFor.get(n.from) || n.from);
      for (const r of data.query?.redirects || []) originalFor.set(r.to, originalFor.get(r.from) || r.from);

      for (const page of Object.values(data.query?.pages || {})) {
        const c = page.coordinates?.[0];
        if (!c) continue;
        const originalTitle = originalFor.get(page.title) || page.title;
        const context = contextMap.get(page.title) || contextMap.get(originalTitle) || '';
        found.push({
          qid: page.pageprops?.wikibase_item || `page-${page.pageid}`,
          title: page.title,
          lat: c.lat,
          lng: c.lon,
          wikiTitle: page.title,
          source,
          sourceContext: context
        });
      }
      if (i + 50 < titles.length) await sleep(30);
    }
    return dedupePlaces(found);
  };
  </script>
  <script>
  (()=>{
    const list=document.getElementById('topicList'),count=document.getElementById('sheetCount'),filters=document.getElementById('topicFilters'),buttons=[...document.querySelectorAll('.topic-filter')];
    const state={transit_stop:false,route:false,numbered_road:false,transit_operator:false,place:false,date:false,org:false,common:false};
    const CACHE_KEY='wiki-map-topic-types-v6',cache=new Map();let runId=0,timer=0;
    try{const saved=JSON.parse(localStorage.getItem(CACHE_KEY)||'{}');for(const [k,v] of Object.entries(saved))cache.set(k,v)}catch(_){}
    const exact={
      transit_stop:new Set(['鉄道駅','駅','停留場','停留所','バス停','バスターミナル','地下鉄駅','路面電車停留場','railway station','train station','bus stop','tram stop','metro station','bus station'].map(x=>x.toLowerCase())),
      route:new Set(['鉄道路線','地下鉄路線','高速鉄道路線','路面電車路線','バス路線','railway line','rapid transit line','tram line','bus route'].map(x=>x.toLowerCase())),
      transit_operator:new Set(['鉄道事業者','鉄道会社','バス事業者','バス会社','交通事業者','公共交通事業者','railway company','rail transport company','bus company','public transport operator','transport company'].map(x=>x.toLowerCase())),
      place:new Set(['行政区画','行政区域','行政区','都市','市町村','市','町','村','区','都道府県','県','国','国家','島','地方','地域','地理的地域','集落','地区','郡','大字','町丁','住宅地','地名','human settlement','administrative territorial entity','administrative division','ward','city','town','village','prefecture','country','island','geographic region','district','neighborhood','locality'].map(x=>x.toLowerCase())),
      date:new Set(['年','暦日','日付','世紀','年代','元号','時代区分','year','calendar date','century','decade','era'].map(x=>x.toLowerCase())),
      org:new Set(['企業','会社','株式会社','法人','組織','団体','学校','大学','銀行','事業者','病院','新聞社','出版社','company','business','organization','organisation','corporation','university','school','bank','hospital','publisher'].map(x=>x.toLowerCase())),
      common:new Set(['概念','用語','現象','活動','学問分野','分野','ジャンル','職業','制度','思想','理論','技法','単位','識別子','コード','一覧','座標系','郵便番号','concept','term','phenomenon','activity','academic discipline','genre','occupation','system','theory','unit','identifier','code','list','coordinate system','postal code'].map(x=>x.toLowerCase()))
    };
    const titleOf=chip=>chip.textContent.replace(/\s+\d+\s*$/,'').trim();
    const isTopics=()=>document.querySelector('.sheet-tab.active')?.dataset.tab==='topics';
    function obvious(t){
      if(/^(?:\d{3,4}年|\d{1,2}月\d{1,2}日|\d{1,2}月|\d{1,2}日|\d{1,2}世紀|\d{3,4}年代)$/.test(t)||/^(?:明治|大正|昭和|平成|令和)(?:\d+年?)?$/.test(t))return'date';
      if(/(?:国道|県道|都道|府道|道道)\s*\d+号/.test(t))return'numbered_road';
      if(/(?:駅|停留場|停留所|バス停|バスターミナル|停車場)$/.test(t))return'transit_stop';
      if(/(?:地下鉄|鉄道|新幹線|モノレール|市電|路面電車).*(?:線|路線)$/.test(t)||/(?:本線|支線)$/.test(t))return'route';
      if(/^(?:JR九州|西日本鉄道|西鉄バス|福岡市交通局|福岡市地下鉄)$/.test(t)||/(?:鉄道会社|バス会社|交通局)$/.test(t))return'transit_operator';
      if(/\((?:[^)]+市|[^)]+県|[^)]+区|[^)]+町|[^)]+村)\)$/.test(t)||(/(?:都|府|県|市|区|町|村|郡|地方|地区|地域)$/.test(t)&&!/(?:会社|大学|学校|病院)$/.test(t)))return'place';
      if(/(?:株式会社|有限会社|会社|銀行|大学|学校|中学校|高等学校|小学校|病院|新聞社|放送局|協会|財団|法人)$/.test(t))return'org';
      if(/^(?:ISBN(?: \(識別子\))?|UTC(?:[+-]\d+)?|メートル|地理座標系|日本の郵便番号|学校コード|国の一覧|都市計画|用途地域)$/.test(t)||/一覧$/.test(t))return'common';
      return null;
    }
    function fromLabels(labels){const s=new Set(labels.map(x=>String(x).trim().toLowerCase()));for(const cat of ['transit_stop','route','transit_operator','date','org','place','common'])for(const x of exact[cat])if(s.has(x))return cat;return'other'}
    async function getJson(url){const r=await fetch(url);if(!r.ok)throw new Error(r.status);return r.json()}
    async function classifyBatch(titles){
      const out=new Map(),p=new URLSearchParams({action:'query',format:'json',origin:'*',prop:'pageprops',ppprop:'wikibase_item',redirects:'1',titles:titles.join('|')}),pages=await getJson('https://ja.wikipedia.org/w/api.php?'+p),alias=new Map(titles.map(t=>[t,t]));
      for(const x of pages.query?.normalized||[])alias.set(x.to,alias.get(x.from)||x.from);for(const x of pages.query?.redirects||[])alias.set(x.to,alias.get(x.from)||x.from);
      const qids=new Map();for(const page of Object.values(pages.query?.pages||{})){const original=alias.get(page.title)||page.title,qid=page.pageprops?.wikibase_item;if(qid)qids.set(qid,original);else out.set(original,'other')}
      const ids=[...qids.keys()];if(!ids.length)return out;
      const ep=new URLSearchParams({action:'wbgetentities',format:'json',origin:'*',ids:ids.join('|'),props:'claims'}),entities=await getJson('https://www.wikidata.org/w/api.php?'+ep),types=new Map(),typeIds=new Set();
      for(const qid of ids){const a=(entities.entities?.[qid]?.claims?.P31||[]).map(c=>c.mainsnak?.datavalue?.value?.id).filter(Boolean);types.set(qid,a);a.forEach(x=>typeIds.add(x))}
      const labels=new Map(),all=[...typeIds];for(let i=0;i<all.length;i+=50){const part=all.slice(i,i+50),lp=new URLSearchParams({action:'wbgetentities',format:'json',origin:'*',ids:part.join('|'),props:'labels',languages:'ja|en'}),data=await getJson('https://www.wikidata.org/w/api.php?'+lp);for(const id of part){const e=data.entities?.[id];labels.set(id,[e?.labels?.ja?.value,e?.labels?.en?.value].filter(Boolean))}}
      for(const qid of ids)out.set(qids.get(qid),fromLabels((types.get(qid)||[]).flatMap(id=>labels.get(id)||[])));return out;
    }
    function apply(){if(!isTopics()){filters.hidden=true;return}filters.hidden=false;const chips=[...list.querySelectorAll('.topic-chip')];let shown=0;for(const chip of chips){const cat=chip.dataset.topicCategory||'other',show=cat==='other'||state[cat];chip.hidden=!show;if(show)shown++}if(chips.length)count.textContent=`${shown}/${chips.length}`}
    function save(){try{const o={};for(const [k,v] of cache)o[k]=v;localStorage.setItem(CACHE_KEY,JSON.stringify(o))}catch(_){}}
    async function prepare(){
      if(!isTopics())return;const chips=[...list.querySelectorAll('.topic-chip')];if(!chips.length)return;const id=++runId;list.classList.add('topic-filter-preparing');count.textContent='分類中…';
      const unresolved=[];for(const chip of chips){const t=titleOf(chip);chip.dataset.topicTitle=t;let cat=cache.get(t)||obvious(t);if(cat)cache.set(t,cat);else unresolved.push(t)}
      const unique=[...new Set(unresolved)];
      for(let i=0;i<unique.length;i+=50){if(id!==runId)return;const batch=unique.slice(i,i+50);try{const r=await classifyBatch(batch);for(const t of batch)cache.set(t,r.get(t)||'other')}catch(_){for(const t of batch)if(!cache.has(t))cache.set(t,'other')}count.textContent=`分類中 ${Math.min(i+batch.length,unique.length)}/${unique.length}`;await new Promise(r=>setTimeout(r,20))}
      if(id!==runId)return;for(const chip of chips)chip.dataset.topicCategory=cache.get(chip.dataset.topicTitle)||'other';save();list.classList.remove('topic-filter-preparing');apply();
    }
    buttons.forEach(b=>b.addEventListener('click',()=>{const c=b.dataset.category;state[c]=!state[c];b.classList.toggle('active',state[c]);b.setAttribute('aria-pressed',String(state[c]));apply()}));
    document.querySelectorAll('.sheet-tab').forEach(tab=>tab.addEventListener('click',()=>setTimeout(()=>{if(tab.dataset.tab==='topics')prepare();else filters.hidden=true},0)));
    new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(prepare,80)}).observe(list,{childList:true});
  })();
  </script>
</body>
</html>
